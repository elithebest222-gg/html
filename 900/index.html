<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Geometry Dash</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #canvas {
        width: 100%;
        height: 100%;
        border: 0px none;
        background-color: #000;
        display: block;
      }
      #loading-box {
        position: absolute;
        color: #fff;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        user-select: none;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="loading-box">Geometry Dash<br><br>LOADING...</div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <script>
      const canvas = document.getElementById('canvas');
      const loadingBox = document.getElementById('loading-box');

      // Automatically determine the exact current subfolder pathway location
      const currentFolder = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/')) + '/';

      // Native Emscripten Configuration Layer forcing current subfolder targeting
      var Module = {
        canvas: canvas,
        arguments: [],
        print: function(text) { console.log(text); },
        printErr: function(text) { console.error(text); },
        locateFile: function(path) {
          // Forces WebAssembly engine to look nowhere else but this exact subfolder path
          return currentFolder + path;
        },
        onRuntimeInitialized: function() {
          loadingBox.style.display = 'none';
        }
      };

      // Load flat compiled game bundle specifically from this subfolder path
      fetch(currentFolder + 'gd_web.data')
        .then(res => {
          if (!res.ok) throw new Error("Could not find gd_web.data game build assets in subfolder!");
          return res.arrayBuffer();
        })
        .then(buffer => {
          Module['dataAsset'] = new Uint8Array(buffer);
          
          // Inject standard Javascript runtime engine script pointing strictly to the same subfolder
          const script = document.createElement('script');
          script.src = currentFolder + "gd_web.js";
          document.body.appendChild(script);
        })
        .catch(err => {
          console.error(err);
          loadingBox.innerHTML = "Geometry Dash<br><br><span style='color:#ff4d4d;'>LOADING FAILED</span>";
        });
    </script>
  </body>
</html>

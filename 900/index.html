<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Geometry Dash</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-center: center;
        align-items: center;
      }
      #canvas {
        width: 100%;
        height: 100%;
        border: 0px none;
        background-color: #000;
        display: block;
      }
      #loading-box {
        position: absolute;
        color: #fff;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        user-select: none;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="loading-box">Geometry Dash<br><br>LOADING...</div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <!-- Core Decoding Infrastructure -->
    <script src="brotli-decoder.js"></script>
    <script>
      const canvas = document.getElementById('canvas');
      const loadingBox = document.getElementById('loading-box');

      // The 13 required data splits matching your folder tree
      const partFiles = [
        'gd_web.data.br.part1', 'gd_web.data.br.part2', 'gd_web.data.br.part3',
        'gd_web.data.br.part4', 'gd_web.data.br.part5', 'gd_web.data.br.part6',
        'gd_web.data.br.part7', 'gd_web.data.br.part8', 'gd_web.data.br.part9',
        'gd_web.data.br.part10', 'gd_web.data.br.part11', 'gd_web.data.br.part12',
        'gd_web.data.br.part13'
      ];

      // Download and merge chunks
      Promise.all(partFiles.map(file => fetch(file).then(res => {
        if (!res.ok) throw new Error(`Failed to load chunk: ${file}`);
        return res.arrayBuffer();
      })))
      .then(buffers => {
        // Calculate total size and allocate memory array
        let totalLength = buffers.reduce((acc, buf) => acc + buf.byteLength, 0);
        let combinedArray = new Uint8Array(totalLength);
        
        // Stitch pieces into structural binary sequence
        let offset = 0;
        buffers.forEach(buf => {
          combinedArray.set(new Uint8Array(buf), offset);
          offset += buf.byteLength;
        });

        // Initialize internal Brotli decompression engine
        return BrotliDecode(combinedArray);
      })
      .then(decompressedData => {
        window.Module = {
          canvas: canvas,
          arguments: [],
          locateFile: function(path) { return path; },
          onRuntimeInitialized: function() {
            loadingBox.style.display = 'none';
          }
        };

        // Pass decompressed assets directly into Module cache memory allocation
        Module['dataAsset'] = decompressedData;

        // Safely fetch and run core WebAssembly engines
        return fetch('gd_web.js.br')
          .then(res => res.arrayBuffer())
          .then(buf => BrotliDecode(new Uint8Array(buf)));
      })
      .then(jsBuffer => {
        // Execute clean JS runtime engine thread natively
        const scriptText = new TextDecoder('utf-8').decode(jsBuffer);
        const scriptElement = document.createElement('script');
        scriptElement.text = scriptText;
        document.body.appendChild(scriptElement);
      })
      .catch(err => {
        console.error(err);
        loadingBox.innerHTML = "Geometry Dash<br><br><span style='color:#ff4d4d;'>LOADING FAILED</span>";
      });
    </script>
  </body>
</html>

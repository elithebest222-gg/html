name: Copy Geometry Dash Web Port
on:
  workflow_dispatch:

jobs:
  copy-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Native permission to push files back to the independent repo
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Built-in token works perfectly now
          fetch-depth: 0

      - name: Clone Geometry Dash repo
        run: |
          git clone --depth 1 https://github.com/elithebest222-gg/geometry-dash temp-repo
          cd temp-repo
          git lfs install
          git lfs pull
          cd ..

      - name: Set Up Git LFS Tracking
        run: |
          git lfs install
          
          # Instruct the system to intercept your split game engine parts inside folder 900
          git lfs track "900/*.wasm"
          git lfs track "900/*.data"
          git lfs track "900/*.br"
          git lfs track "900/*.part*"
          
          git add .gitattributes

      - name: Move Assets to Target Location 900
        run: |
          mkdir -p 900
          rm -rf temp-repo/.git
          
          if [ -f "temp-repo/index.html" ]; then
            rsync -av --delete temp-repo/ 900/
          else
            echo "::error::Source game files not found in temp-repo!"
            exit 1
          fi

      - name: Clean Up Temporary Workspace
        run: |
          rm -rf temp-repo

      - name: Commit and push changes safely to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          git rm --cached -r --ignore-unmatch 900/ || true
          git add 900/
          
          git commit -m "Imported Geometry Dash web assets into 900 folder via Git LFS" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
